<!doctype html>
<html lang="ko">
<head>
  <script data-erpatch-redirect>
  (() => {
    const destination = new URL("12.7/index.html", location.href);
    destination.search = location.search;
    destination.hash = location.hash;
    const site = new URL("https://sinoso.github.io/er_patch_pages/");
    const published = location.origin === site.origin && location.pathname.startsWith(site.pathname);
    if (published) {
      try {
        sessionStorage.setItem("erpatch:redirect-attribution", JSON.stringify({
          destination: destination.href, referrer: document.referrer, time: Date.now()
        }));
      } catch (_) {}
    }
    location.replace(destination.href);
  })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <noscript><meta http-equiv="refresh" content="0;url=12.7/index.html"></noscript>
  <title>이터널 리턴 패치노트</title>
  <style>:root{color-scheme:dark}body{margin:40px;background:#0c111c;color:#edf2fa;font:16px/1.6 'Malgun Gothic',sans-serif}a{color:#b9bcff}</style>
</head>
<body>
  <p><a href="12.7/index.html">12.7 패치노트 열기</a></p>
</body>
</html>
